name: E2E Tests (real backend)

on:
  pull_request:
    branches: [main, develop]
    types: [labeled, synchronize]

jobs:
  e2e-real:
    name: E2E Tests (real backend)
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'e2e-real')
    environment: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @wrenchly/web db:generate
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}

      - name: Run Prisma migrations
        run: pnpm --filter @wrenchly/web db:migrate
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}

      - name: Install Playwright browsers
        run: pnpm --filter @wrenchly/web exec playwright install --with-deps chromium

      - name: Run real E2E tests
        run: pnpm --filter @wrenchly/web test:e2e
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-real
          path: apps/web/playwright-report/
          retention-days: 14
