name: E2E Tests (real backend)

on:
  pull_request:
    branches: [main, develop]
    types: [labeled, synchronize]

jobs:
  e2e-real:
    name: E2E Tests (real backend)
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'e2e-real')
    # Same ephemeral-Postgres pattern as integration-tests — no external test
    # database or secrets needed. global-setup.ts logs in as an existing user
    # rather than signing one up itself, so "Seed E2E test user" below creates
    # that user first.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wrenchly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/wrenchly_test
      DIRECT_URL: postgresql://test:test@localhost:5432/wrenchly_test
      BETTER_AUTH_SECRET: ci-e2e-real-test-secret-32-chars-min
      # Never actually sent — this suite doesn't exercise email-sending flows,
      # Resend's SDK just needs a key-shaped value to construct without error.
      BREVO_API_KEY: ci_fake_key_not_a_real_credential
      CRON_SECRET: ci-e2e-real-cron-secret-32-chars-min
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      E2E_TEST_EMAIL: e2e@wrenchly.test
      E2E_TEST_PASSWORD: TestPassword123!
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @wrenchly/web db:generate

      - name: Run Prisma migrations
        run: pnpm --filter @wrenchly/web db:migrate

      - name: Seed E2E test user
        run: pnpm --filter @wrenchly/web db:seed:e2e

      - name: Install Playwright browsers
        run: pnpm --filter @wrenchly/web exec playwright install --with-deps chromium

      - name: Run real E2E tests
        run: pnpm --filter @wrenchly/web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-real
          path: apps/web/playwright-report/
          retention-days: 14
